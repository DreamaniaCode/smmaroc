version: '3.8'

services:
  # Web Dashboard Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-smm-panel-coolify-super-secret-key-32chars}
      - ADMIN_INITIAL_EMAIL=${ADMIN_INITIAL_EMAIL:-admin@agency.com}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-AdminPassword123!}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - smm_data:/app/data

  # Background Automation Worker (Cron, Failover & Google Sheets Syncer)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - smm_data:/app/data
    depends_on:
      - app

volumes:
  smm_data:
    driver: local
